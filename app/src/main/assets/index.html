<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de Mods</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#bfe6ff;font:18px/1.4 "Trebuchet MS",system-ui,sans-serif;color:#2b2118;-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding:12px 12px 40px}
h1{margin:0;font-size:26px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card{background:#fff;border:4px solid #2b2118;border-radius:6px;padding:12px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.opt{min-height:76px;border:3px solid #2b2118;background:#f4efe6;border-radius:6px;font:inherit;font-size:14px;color:inherit;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opt .e{font-size:30px;line-height:1.1}
.opt.on{background:#7ed957;box-shadow:inset 0 0 0 3px #fff}
.sw{height:52px;border:3px solid #2b2118;border-radius:6px}
.sw.on{outline:4px solid #fff;box-shadow:0 0 0 3px #2b2118}
.btn{display:block;width:100%;padding:16px;font:inherit;font-weight:700;font-size:20px;color:#fff;background:#4caf3a;border:4px solid #2b2118;border-radius:6px;box-shadow:0 5px 0 #2b2118;margin:12px 0}
.btn.alt{background:#e8870e}.btn.pur{background:#8e44ad}.btn.blue{background:#2f7fe0}
input[type=text]{width:100%;padding:12px;font:inherit;border:3px solid #2b2118;border-radius:6px}
input[type=color]{width:100%;height:54px;border:3px solid #2b2118;border-radius:6px;padding:2px;background:#fff}
.back{padding:8px 12px;font:inherit;font-weight:700;border:3px solid #2b2118;background:#fff;border-radius:6px}
.toast{background:#fff3b0;border:3px solid #2b2118;border-radius:6px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:2px dashed #cbb}
.row:first-of-type{border-top:0}
.row code{font-size:13px;background:#eee;padding:2px 4px;word-break:break-all}
.del{border:3px solid #2b2118;background:#fff;border-radius:6px;padding:6px 10px;font:inherit;flex:none}
.half{display:grid;grid-template-columns:1fr 1fr;gap:10px}
small{color:#5b4b3c}
</style>
</head>

   if(r.k==='x'){var l=who?who.location:c.loc,d=who?who.dimension:c.dim;d.createExplosion(l,r.r,{breaksBlocks:!!r.b});return}

  }catch(e){}

 var n=0;system.runInterval(function(){n++;R.forEach(function(r){if(r.t==='tiempo'&&n%r.e===0)world.getAllPlayers().forEach(function(p){go(r,{player:p,dim:p.dimension,loc:p.location})})})},20);

  d.identifier=full;d.spawn_egg={base_color:o.c1.toUpperCase(),overlay_color:o.c2.toUpperCase()};if(m.base==='steve')d.textures={default:'textures/entity/steve'};
  bp.file('entities/'+m.id+'.json',JSON.stringify(mobEnt(m,o.egg!=='0'),null,2));

  if(o.wild)bp.file('spawn_rules/'+m.id+'.json',JSON.stringify(spawnRule(m.id,o.wild,o.freq,o.mode==='pasivo'?'animal':'monster'),null,2));
  if(m.loot)bp.file('loot_tables/'+NS+'/'+m.loot+'.json',JSON.stringify({pools:[{rolls:1,entries:o.loot.map(function(i){return{type:'item',name:'minecraft:'+i,weight:1,functions:[{function:'set_count',count:{min:1,max:3}}]}})}]},null,2));
  lang+='entity.'+full+'.name='+o.name+'\nitem.spawn_egg.entity.'+full+'.name=Huevo de '+o.name+'\n';recipe(bp,o)});
 var it={},tt={};
 P.items.forEach(function(o){var c={'minecraft:display_name':{value:o.name},'minecraft:icon':{textures:{default:o.id}},'minecraft:max_stack_size':o.kind==='espada'?1:64};

  if(o.kind==='comida'){c['minecraft:food']={nutrition:{poco:3,normal:6,mucho:10}[o.power]||6,saturation_modifier:'normal',can_always_eat:false};c['minecraft:use_modifiers']={use_duration:1.6,movement_modifier:0.35}}

  it[o.id]={textures:'textures/items/'+o.id};rp.file('textures/items/'+o.id+'.png',icon(o.kind,o.color),{base64:true});recipe(bp,o)});
 if(P.items.length)rp.file('textures/item_texture.json',JSON.stringify({resource_pack_name:name,texture_name:'atlas.items',texture_data:it},null,2));
 P.blocks.forEach(function(o){
  bp.file('blocks/'+o.id+'.json',JSON.stringify({format_version:'1.21.0','minecraft:block':{description:{identifier:NS+':'+o.id,menu_category:{category:'construction'}},components:{'minecraft:destructible_by_mining':{seconds_to_destroy:{blando:1,normal:3,duro:10,durisimo:50}[o.hard]||3},'minecraft:light_emission':+o.light||0,'minecraft:material_instances':{'*':{texture:'b_'+o.id,render_method:'opaque'}}}}},null,2));

 rp.file('texts/languages.json',JSON.stringify(['es_ES','en_US']));rp.file('texts/es_ES.lang',lang);rp.file('texts/en_US.lang',lang);
