name: Crear APK

# - Cada push a main: compila y deja la APK en "Artifacts" para probar.
#   Si el número de version.txt todavía no tiene Release, lo crea solo (vX.Y.Z).
# - Al publicar un Release (en la web: Releases > Draft a new release, etiqueta vX.Y.Z)
#   o al subir una etiqueta vX.Y.Z: compila y deja TallerDeMods.apk en ese Release.
#   La app lo detecta y se actualiza sola.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Calcular versión
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUEVO=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d ' \r\n' < version.txt)"
            if [[ "$GITHUB_EVENT_NAME" == push ]] && ! gh release view "v$V" >/dev/null 2>&1; then
              NUEVO=true
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "nuevo=$NUEVO" >> "$GITHUB_OUTPUT"

      - name: Compilar la app
        run: gradle assembleRelease --no-daemon -PappVersion=${{ steps.ver.outputs.version }}

      - name: Nombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk TallerDeMods.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TallerDeMods-APK
          path: TallerDeMods.apk

      - name: Adjuntar APK al release publicado en la web
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" TallerDeMods.apk --clobber

      - name: Crear release desde una etiqueta
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTAS="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          [ -z "$NOTAS" ] && NOTAS="Versión ${GITHUB_REF_NAME#v} de Taller de Mods."
          gh release create "$GITHUB_REF_NAME" TallerDeMods.apk \
            --title "Taller de Mods ${GITHUB_REF_NAME}" --notes "$NOTAS"

      - name: Crear release porque version.txt subió
        if: steps.ver.outputs.nuevo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          NOTAS="$(git log -1 --format=%B | grep -vE "^(Co-Authored-By|Claude-Session):")"
          gh release create "v$V" TallerDeMods.apk --target "$GITHUB_SHA" \
            --title "Taller de Mods v$V" --notes "$NOTAS"
