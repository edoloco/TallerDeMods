<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de Mods</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#bfe6ff;font:18px/1.4 "Trebuchet MS",system-ui,sans-serif;color:#2b2118;-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding:12px 12px 40px}
h1{margin:0;font-size:26px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card{background:#fff;border:4px solid #2b2118;border-radius:6px;padding:12px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.opt{min-height:76px;border:3px solid #2b2118;background:#f4efe6;border-radius:6px;font:inherit;font-size:14px;color:inherit;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opt .e{font-size:30px;line-height:1.1}
.opt.on{background:#7ed957;box-shadow:inset 0 0 0 3px #fff}
.sw{height:52px;border:3px solid #2b2118;border-radius:6px}
.sw.on{outline:4px solid #fff;box-shadow:0 0 0 3px #2b2118}
.btn{display:block;width:100%;padding:16px;font:inherit;font-weight:700;font-size:20px;color:#fff;background:#4caf3a;border:4px solid #2b2118;border-radius:6px;box-shadow:0 5px 0 #2b2118;margin:12px 0}
.btn.alt{background:#e8870e}.btn.pur{background:#8e44ad}.btn.blue{background:#2f7fe0}
input[type=text]{width:100%;padding:12px;font:inherit;border:3px solid #2b2118;border-radius:6px}
input[type=color]{width:100%;height:54px;border:3px solid #2b2118;border-radius:6px;padding:2px;background:#fff}
.back{padding:8px 12px;font:inherit;font-weight:700;border:3px solid #2b2118;background:#fff;border-radius:6px}
.toast{background:#fff3b0;border:3px solid #2b2118;border-radius:6px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:2px dashed #cbb}
.row:first-of-type{border-top:0}
.row code{font-size:13px;background:#eee;padding:2px 4px;word-break:break-all}
.del{border:3px solid #2b2118;background:#fff;border-radius:6px;padding:6px 10px;font:inherit;flex:none}
.half{display:grid;grid-template-columns:1fr 1fr;gap:10px}
small{color:#5b4b3c}
</style>
</head>

 return{png:cv.toDataURL('image/png').split(',')[1],geo:{format_version:'1.12.0','minecraft:geometry':[{description:{identifier:'geometry.'+NS+'_shape_'+sh.id,texture_width:64,texture_height:64,visible_bounds_width:Math.ceil(dm.W/16)+2,visible_bounds_height:Math.ceil(dm.H/16)+2,visible_bounds_offset:[0,dm.H/32,0]},bones:[{name:'root',pivot:[0,0,0],cubes:cubes}]}]}}}
document.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;var d=t.dataset;
 if(d.xnew)return openShape(-1);
 if(d.xedit)return openShape(+d.xedit);
 if(d.xdel){var sh=P.shapes[+d.xdel];P.shapes.splice(+d.xdel,1);['mobs','blocks'].forEach(function(k){P[k].forEach(function(o){if(o.shape===sh.id)o.shape=''})});saveP();return render()}
 if(d.xback)return go(SH.from==='mob'||SH.from==='block'?SH.from:'shapes');
 if(d.xtpl){SH.vox=tplVox(d.xtpl);return render()}
 if(d.xup){SH.layer=Math.min(SH.H-1,SH.layer+1);return render()}
 if(d.xw||d.xh){var W1=d.xw?+d.xw:SH.W,H1=d.xh?+d.xh:SH.H;if(W1===SH.W&&H1===SH.H)return;
  var lost=false;if(H1<SH.H)for(var q=SH.W*SH.W*H1;q<SH.vox.length;q++)if(SH.vox[q]){lost=true;break}
  SH.hist=[];SH.vox=resizeVox(SH.vox,SH.W,SH.H,W1,H1);SH.W=W1;SH.H=H1;SH.layer=Math.min(SH.layer,H1-1);SH.ox=0;SH.oz=0;if(W1>16){SH.ox=SH.oz=Math.floor((W1-16)/2)}
  return toast(lost?'📏 Tamaño cambiado (se cortó lo que estaba muy arriba)':'📏 Tamaño: '+W1+'×'+W1+', '+H1+' capas')}
 if(d.xpan){var pp=d.xpan.split(',');SH.ox=Math.max(0,Math.min(SH.W-16,SH.ox+8*pp[0]));SH.oz=Math.max(0,Math.min(SH.W-16,SH.oz+8*pp[1]));return render()}
 if(d.xdown){SH.layer=Math.max(0,SH.layer-1);return render()}
 if(d.xt){SH.tool=d.xt;return render()}
 if(d.xc){SH.col=d.xc;if(SH.tool==='goma'||SH.tool==='gotero')SH.tool='lapiz';return render()}
 if(d.xmir){SH.mir=!SH.mir;return render()}
 if(d.xundo){if(SH.hist.length)SH.vox=SH.hist.pop();return drawLayer()}
 if(d.xcopy){if(!SH.layer)return toast('El piso no tiene capa abajo 🙂');SH.hist.push(SH.vox.slice());for(var z=0;z<SH.W;z++)for(var x=0;x<SH.W;x++)SH.vox[vi(x,SH.layer,z)]=SH.vox[vi(x,SH.layer-1,z)];return drawLayer()}
 if(d.xclear){SH.hist.push(SH.vox.slice());for(z=0;z<SH.W;z++)for(x=0;x<SH.W;x++)SH.vox[vi(x,SH.layer,z)]='';return drawLayer()}
 if(d.xsave)return saveShape()});
document.addEventListener('input',function(e){if(e.target.dataset.xname)SH.name=e.target.value});
document.addEventListener('change',function(e){if(e.target.dataset.xcol){SH.col=e.target.value;if(SH.tool!=='balde')SH.tool='lapiz';render()}});

var UPD={};
function updBox(){if(!window.Android||!Android.version)return'';var v='<p style="text-align:center"><small>Versión '+esc(Android.version())+'</small></p>'
 +(UPD.estado==='hay'||UPD.estado==='bajando'?'':btn('alt',UPD.estado==='buscando'?'🔎 Buscando…':'🔄 Buscar actualizaciones','data-check="1"'))
 +(UPD.estado==='ultima'?'<p style="text-align:center">✅ Ya tienes la última versión</p>':UPD.estado==='sinred'?'<p style="text-align:center">📶 No se pudo revisar. ¿Hay internet?</p>':'');
 if(UPD.estado==='hay')return'<div class="card" style="background:#fff3b0"><h2>🎁 ¡Hay una versión nueva! ('+esc(UPD.nueva)+')</h2>'+(UPD.notas?'<p><small>'+esc(UPD.notas).replace(/\n/g,'<br>')+'</small></p>':'')+btn('','⬇️ Actualizar ahora','data-upd="1"')+'</div>'+v;
 if(UPD.estado==='bajando')return'<div class="card"><h2>⬇️ Descargando… '+(UPD.pct||0)+'%</h2><small>No cierres la app.</small></div>'+v;
 if(UPD.estado==='permiso')return'<div class="card"><h2>🔓 Falta un permiso</h2><p><small>Activa “Permitir de esta fuente” y vuelve con la flecha atrás.</small></p></div>'+v;
 if(UPD.estado==='listo')return'<div class="card"><h2>✅ Descargada</h2><p><small>Toca “Actualizar” en la ventana de Android. Tus creaciones no se borran.</small></p></div>'+v;
 if(UPD.estado==='error')return'<div class="card"><h2>😕 No se pudo descargar</h2>'+btn('alt','🔄 Probar otra vez','data-upd="1"')+'</div>'+v;
 return v}
window.onActualizacion=function(j){try{var r=JSON.parse(j),man=UPD.estado==='buscando';
 if(r.hay)UPD={estado:'hay',nueva:r.nueva,notas:r.notas};else if(man)UPD={estado:r.error?'sinred':'ultima'};else return;if(scr==='home')render()}catch(e){}};
window.onProgreso=function(p){UPD.pct=+p;if(scr==='home')render()};
window.onDescarga=function(j){var r=JSON.parse(j);UPD.estado=r.ok?'listo':'error';if(scr==='home')render()};
window.onPermiso=function(){UPD.estado='permiso';if(scr==='home')render()};
document.addEventListener('click',function(e){var t=e.target.closest('button');if(!t||!t.dataset.check)return;if(UPD.estado==='buscando')return;UPD={estado:'buscando'};render();Android.buscarActualizacion()});
document.addEventListener('click',function(e){var t=e.target.closest('button');if(!t||!t.dataset.upd)return;
 var r=Android.actualizar();if(r==='ok'){UPD.estado='bajando';UPD.pct=0}else{UPD.estado='error'}render()});
render();
try{if(window.Android&&Android.buscarActualizacion)Android.buscarActualizacion()}catch(e){}
</script>
